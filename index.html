<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>美食隨手搜 - Mobile Restaurant Finder</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom styles for mobile fluidity and touch targets */
        body {
            font-family: 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Hide scrollbars for clean horizontally scrolling tags */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Range slider track style */
        input[type=range] {
            accent-color: #f97316;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-20 select-none">

    <!-- App Header -->
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-gray-100 shadow-sm px-4 py-3">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="bg-brand-500 text-white p-2 rounded-xl shadow-sm">
                    <i class="fa-solid font-bold fa-utensils"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-gray-900 leading-tight">美食靈感搜</h1>
                    <p class="text-xs text-gray-500">預算精算 · 周邊快搜</p>
                </div>
            </div>
            <button id="randomPickBtn" onclick="openRandomModal()" class="flex items-center space-x-1 text-xs font-semibold bg-brand-50 text-brand-600 border border-brand-200 px-3 py-2 rounded-full active:scale-95 transition">
                <i class="fa-solid fa-dice text-brand-500"></i>
                <span>幫我選</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto px-4 pt-4 space-y-4">

        <!-- Location & Distance Card -->
        <section class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2 text-sm text-gray-700 font-medium">
                    <i class="fa-solid fa-location-dot text-brand-500"></i>
                    <span id="locationStatus" class="truncate max-w-[200px]">正在獲取定位...</span>
                </div>
                <button onclick="getUserLocation()" class="text-xs text-brand-600 bg-brand-50 px-2.5 py-1 rounded-lg font-semibold active:bg-brand-100 transition flex items-center space-x-1">
                    <i class="fa-solid fa-arrows-rotate text-[10px]"></i>
                    <span>重新定位</span>
                </button>
            </div>

            <!-- Distance Selector -->
            <div class="flex items-center justify-between text-xs text-gray-500 pt-1 border-t border-gray-50">
                <span>搜尋半徑：</span>
                <div class="flex space-x-1" id="distanceGroup">
                    <button onclick="setDistance(500)" class="dist-btn px-2.5 py-1 rounded-full bg-gray-100 text-gray-600 font-medium transition active:scale-95" data-dist="500">500m</button>
                    <button onclick="setDistance(1000)" class="dist-btn px-2.5 py-1 rounded-full bg-brand-500 text-white font-medium transition active:scale-95" data-dist="1000">1 km</button>
                    <button onclick="setDistance(3000)" class="dist-btn px-2.5 py-1 rounded-full bg-gray-100 text-gray-600 font-medium transition active:scale-95" data-dist="3000">3 km</button>
                </div>
            </div>
        </section>

        <!-- Budget & Filter Panel -->
        <section class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-sm font-bold text-gray-900 flex items-center space-x-1.5">
                    <i class="fa-solid fa-wallet text-brand-500"></i>
                    <span>預算區間篩選 (NT$)</span>
                </h2>
                <span class="text-xs font-bold text-brand-600 bg-brand-50 px-2 py-0.5 rounded" id="budgetDisplay">
                    $0 - $500
                </span>
            </div>

            <!-- Price Inputs -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-gray-50 p-2.5 rounded-xl border border-gray-200/80">
                    <label class="block text-[10px] font-semibold text-gray-400 uppercase">最低金額 (Min)</label>
                    <div class="flex items-center space-x-1 mt-0.5">
                        <span class="text-xs text-gray-500 font-medium">$</span>
                        <input type="number" id="minPriceInput" value="0" min="0" max="2000" step="50" onchange="onBudgetInputChange()" class="w-full bg-transparent font-bold text-sm text-gray-800 focus:outline-none">
                    </div>
                </div>

                <div class="bg-gray-50 p-2.5 rounded-xl border border-gray-200/80">
                    <label class="block text-[10px] font-semibold text-gray-400 uppercase">最高金額 (Max)</label>
                    <div class="flex items-center space-x-1 mt-0.5">
                        <span class="text-xs text-gray-500 font-medium">$</span>
                        <input type="number" id="maxPriceInput" value="500" min="0" max="3000" step="50" onchange="onBudgetInputChange()" class="w-full bg-transparent font-bold text-sm text-gray-800 focus:outline-none">
                    </div>
                </div>
            </div>

            <!-- Quick Budget Presets -->
            <div class="flex items-center space-x-2 text-xs overflow-x-auto no-scrollbar pt-1">
                <span class="text-gray-400 shrink-0">快選:</span>
                <button onclick="setBudgetPreset(0, 150)" class="shrink-0 bg-gray-100 active:bg-brand-100 text-gray-700 px-3 py-1 rounded-lg">平價銅板 (&le;$150)</button>
                <button onclick="setBudgetPreset(150, 400)" class="shrink-0 bg-gray-100 active:bg-brand-100 text-gray-700 px-3 py-1 rounded-lg">日常簡餐 ($150-400)</button>
                <button onclick="setBudgetPreset(400, 1000)" class="shrink-0 bg-gray-100 active:bg-brand-100 text-gray-700 px-3 py-1 rounded-lg">聚餐大餐 ($400-1000)</button>
            </div>

            <!-- Category & Sort Filters -->
            <div class="pt-2 border-t border-gray-100 space-y-2">
                <!-- Food Categories -->
                <div class="flex space-x-2 overflow-x-auto no-scrollbar py-1" id="categoryContainer">
                    <!-- Dynamic Buttons Generated by JS -->
                </div>
            </div>

            <!-- Action Button -->
            <button onclick="applyFiltersAndSearch()" class="w-full bg-brand-500 active:bg-brand-600 text-white font-bold py-3 rounded-xl shadow-lg shadow-brand-500/30 flex items-center justify-center space-x-2 transition active:scale-[0.98]">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>立即搜尋美食</span>
            </button>
        </section>

        <!-- Search Results Header -->
        <div class="flex items-center justify-between px-1">
            <h3 class="text-sm font-bold text-gray-800 flex items-center space-x-1.5">
                <span>搜尋結果</span>
                <span id="resultCount" class="text-xs bg-gray-200 text-gray-700 px-2 py-0.5 rounded-full font-semibold">0</span>
            </h3>

            <!-- Sorting Dropdown -->
            <select id="sortBySelect" onchange="renderRestaurants()" class="text-xs bg-white border border-gray-200 rounded-lg px-2 py-1.5 font-medium text-gray-700 focus:outline-none">
                <option value="distance">距離最近</option>
                <option value="rating">評價最高</option>
                <option value="priceAsc">價格 (低 → 高)</option>
                <option value="priceDesc">價格 (高 → 低)</option>
            </select>
        </div>

        <!-- Restaurant Cards Container -->
        <div id="restaurantList" class="space-y-3">
            <!-- Dynamic Content -->
        </div>

    </main>

    <!-- Random Selection Modal (抽籤決定) -->
    <div id="randomModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 text-center shadow-2xl transform transition-all space-y-4">
            <div class="w-16 h-16 bg-brand-100 text-brand-500 rounded-full flex items-center justify-center mx-auto text-2xl">
                <i class="fa-solid fa-dice-five animate-bounce"></i>
            </div>
            <div>
                <h3 class="text-lg font-bold text-gray-900">今天吃這個！</h3>
                <p class="text-xs text-gray-500 mt-1">為您從符合預算的選項中隨機挑選</p>
            </div>

            <div id="randomResultCard" class="bg-gray-50 p-4 rounded-2xl border border-gray-100 text-left space-y-2">
                <!-- Dynamic Content -->
            </div>

            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="pickRandomRestaurant()" class="w-full bg-gray-100 active:bg-gray-200 text-gray-700 font-bold py-2.5 rounded-xl text-sm transition">
                    換一個
                </button>
                <button onclick="confirmPick()" class="w-full bg-brand-500 active:bg-brand-600 text-white font-bold py-2.5 rounded-xl text-sm transition shadow-md shadow-brand-500/20">
                    就吃這家
                </button>
            </div>
        </div>
    </div>

    <script>
        // Mock dataset centered around Zhongshan District, Taipei
        const mockRestaurants = [
            {
                id: 1,
                name: "肥前屋鰻魚飯",
                category: "日式料理",
                minPrice: 250,
                maxPrice: 480,
                rating: 4.3,
                reviews: 5800,
                distanceMeters: 350,
                address: "台北市中山區中山北路一段105巷121號",
                image: "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=500&auto=format&fit=crop&q=60",
                tags: ["鰻魚飯", "老店", "排隊美食"]
            },
            {
                id: 2,
                name: "誠記越南麵食館",
                category: "東南亞",
                minPrice: 120,
                maxPrice: 220,
                rating: 4.2,
                reviews: 1200,
                distanceMeters: 600,
                address: "台北市中山區南京東路二段",
                image: "https://images.unsplash.com/photo-1582878826629-29b7ad1cdc43?w=500&auto=format&fit=crop&q=60",
                tags: ["河粉", "平價", "快速"]
            },
            {
                id: 3,
                name: "勝立家和牛拉麵",
                category: "日式料理",
                minPrice: 280,
                maxPrice: 450,
                rating: 4.6,
                reviews: 890,
                distanceMeters: 800,
                address: "台北市中山區林森北路",
                image: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=500&auto=format&fit=crop&q=60",
                tags: ["濃郁湯頭", "宵夜", "拉麵"]
            },
            {
                id: 4,
                name: "阿娥水餃",
                category: "小吃/麵食",
                minPrice: 70,
                maxPrice: 130,
                rating: 4.4,
                reviews: 3200,
                distanceMeters: 450,
                address: "台北市中山區南京東路二段21巷",
                image: "https://images.unsplash.com/photo-1496116218417-1a781b1c416c?w=500&auto=format&fit=crop&q=60",
                tags: ["鮮蝦水餃", "銅板美食", "午餐熱門"]
            },
            {
                id: 5,
                name: "赤峰街無名排骨飯",
                category: "台式/便當",
                minPrice: 100,
                maxPrice: 160,
                rating: 4.1,
                reviews: 940,
                distanceMeters: 900,
                address: "台北市大同區赤峰街",
                image: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500&auto=format&fit=crop&q=60",
                tags: ["便當", "古早味", "排骨"]
            },
            {
                id: 6,
                name: "Miracle Coffee 中山",
                category: "咖啡/輕食",
                minPrice: 150,
                maxPrice: 350,
                rating: 4.5,
                reviews: 1450,
                distanceMeters: 550,
                address: "台北市中山區中山北路一段",
                image: "https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?w=500&auto=format&fit=crop&q=60",
                tags: ["下午茶", "手沖咖啡", "甜點"]
            },
            {
                id: 7,
                name: "青花驕麻辣鍋 中山店",
                category: "火鍋/燒肉",
                minPrice: 650,
                maxPrice: 1200,
                rating: 4.7,
                reviews: 4500,
                distanceMeters: 700,
                address: "台北市中山區中山北路一段137號",
                image: "https://images.unsplash.com/photo-1555126634-323283e090fa?w=500&auto=format&fit=crop&q=60",
                tags: ["聚餐", "麻辣鍋", "高質感"]
            },
            {
                id: 8,
                name: "韓金館 韓國烤肉",
                category: "韓式料理",
                minPrice: 400,
                maxPrice: 800,
                rating: 4.3,
                reviews: 2100,
                distanceMeters: 1200,
                address: "台北市中山區林森北路119巷",
                image: "https://images.unsplash.com/photo-1590301157890-4810ed352733?w=500&auto=format&fit=crop&q=60",
                tags: ["韓式燒肉", "部隊鍋", "聚會"]
            }
        ];

        // App state
        let userLat = 25.0520;
        let userLng = 121.5254;
        let currentDistance = 1000; // in meters
        let selectedCategory = "全部";
        let filteredList = [];
        let currentRandomSelection = null;

        const categories = ["全部", "台式/便當", "日式料理", "小吃/麵食", "東南亞", "火鍋/燒肉", "咖啡/輕食", "韓式料理"];

        // Initialization
        window.onload = function() {
            renderCategoryButtons();
            getUserLocation();
        };

        // Render Category Chips
        function renderCategoryButtons() {
            const container = document.getElementById('categoryContainer');
            container.innerHTML = categories.map(cat => `
                <button onclick="selectCategory('${cat}')" 
                        class="chip-btn shrink-0 px-3 py-1.5 rounded-xl text-xs font-medium border transition ${
                            selectedCategory === cat 
                            ? 'bg-brand-500 text-white border-brand-500 shadow-sm' 
                            : 'bg-gray-100 text-gray-600 border-transparent active:bg-gray-200'
                        }">
                    ${cat}
                </button>
            `).join('');
        }

        // Set category filter
        function selectCategory(cat) {
            selectedCategory = cat;
            renderCategoryButtons();
            applyFiltersAndSearch();
        }

        // Get user location
        function getUserLocation() {
            const statusText = document.getElementById('locationStatus');
            statusText.innerText = "正在取得當前位置...";

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLat = position.coords.latitude;
                        userLng = position.coords.longitude;
                        statusText.innerText = `目前位置 (已定位)`;
                        applyFiltersAndSearch();
                    },
                    (error) => {
                        console.warn("Geolocation error or denied:", error);
                        statusText.innerText = `台北市中山區 (預設位置)`;
                        applyFiltersAndSearch();
                    },
                    { timeout: 8000, enableHighAccuracy: true }
                );
            } else {
                statusText.innerText = `台北市中山區 (預設位置)`;
                applyFiltersAndSearch();
            }
        }

        // Handle distance selection
        function setDistance(dist) {
            currentDistance = dist;
            document.querySelectorAll('.dist-btn').forEach(btn => {
                const bDist = parseInt(btn.getAttribute('data-dist'));
                if (bDist === dist) {
                    btn.className = "dist-btn px-2.5 py-1 rounded-full bg-brand-500 text-white font-medium transition active:scale-95";
                } else {
                    btn.className = "dist-btn px-2.5 py-1 rounded-full bg-gray-100 text-gray-600 font-medium transition active:scale-95";
                }
            });
            applyFiltersAndSearch();
        }

        // Handle budget preset quick click
        function setBudgetPreset(min, max) {
            document.getElementById('minPriceInput').value = min;
            document.getElementById('maxPriceInput').value = max;
            updateBudgetDisplay();
            applyFiltersAndSearch();
        }

        // Handle budget input change
        function onBudgetInputChange() {
            updateBudgetDisplay();
        }

        function updateBudgetDisplay() {
            const min = parseInt(document.getElementById('minPriceInput').value) || 0;
            const max = parseInt(document.getElementById('maxPriceInput').value) || 0;
            document.getElementById('budgetDisplay').innerText = `$${min} - $${max}`;
        }

        // Core filter logic
        function applyFiltersAndSearch() {
            const minBudget = parseInt(document.getElementById('minPriceInput').value) || 0;
            const maxBudget = parseInt(document.getElementById('maxPriceInput').value) || 99999;

            filteredList = mockRestaurants.filter(item => {
                // Distance filter
                if (item.distanceMeters > currentDistance) return false;

                // Category filter
                if (selectedCategory !== "全部" && item.category !== selectedCategory) return false;

                // Budget Overlap Check
                // A restaurant matches if its price range overlaps with the user's budget range
                const priceMatch = (item.minPrice <= maxBudget) && (item.maxPrice >= minBudget);

                return priceMatch;
            });

            renderRestaurants();
        }

        // Render sorted list to DOM
        function renderRestaurants() {
            const container = document.getElementById('restaurantList');
            const sortBy = document.getElementById('sortBySelect').value;

            // Sorting logic
            const sorted = [...filteredList].sort((a, b) => {
                if (sortBy === 'distance') return a.distanceMeters - b.distanceMeters;
                if (sortBy === 'rating') return b.rating - a.rating;
                if (sortBy === 'priceAsc') return a.minPrice - b.minPrice;
                if (sortBy === 'priceDesc') return b.maxPrice - a.maxPrice;
                return 0;
            });

            document.getElementById('resultCount').innerText = sorted.length;

            if (sorted.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-8 text-center border border-gray-100 my-4 space-y-3">
                        <div class="w-12 h-12 bg-gray-100 text-gray-400 rounded-full flex items-center justify-center mx-auto text-xl">
                            <i class="fa-solid fa-utensils"></i>
                        </div>
                        <p class="text-sm font-semibold text-gray-700">找不到符合條件的餐廳</p>
                        <p class="text-xs text-gray-400">嘗試放寬預算上限或擴大搜尋半徑</p>
                        <button onclick="setBudgetPreset(0, 1000)" class="text-xs text-brand-600 border border-brand-200 bg-brand-50 font-bold px-4 py-2 rounded-xl mt-2">
                            重設預算範圍
                        </button>
                    </div>
                `;
                return;
            }

            container.innerHTML = sorted.map(item => `
                <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 flex flex-col sm:flex-row transition active:scale-[0.99]">
                    <!-- Image -->
                    <div class="relative h-36 sm:h-auto sm:w-32 bg-gray-200 shrink-0">
                        <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/400x300/f97316/ffffff?text=Food'">
                        <span class="absolute top-2 left-2 bg-black/60 backdrop-blur-md text-white text-[10px] font-medium px-2 py-0.5 rounded-full">
                            ${item.category}
                        </span>
                    </div>

                    <!-- Details -->
                    <div class="p-3.5 flex-1 flex flex-col justify-between space-y-2">
                        <div>
                            <div class="flex items-start justify-between">
                                <h4 class="font-bold text-gray-900 text-base leading-snug">${item.name}</h4>
                                <div class="flex items-center space-x-1 text-xs text-amber-500 bg-amber-50 px-1.5 py-0.5 rounded font-bold shrink-0">
                                    <i class="fa-solid fa-star text-[10px]"></i>
                                    <span>${item.rating}</span>
                                    <span class="text-[10px] text-gray-400 font-normal">(${item.reviews})</span>
                                </div>
                            </div>
                            <p class="text-xs text-gray-500 mt-1 flex items-center space-x-1">
                                <i class="fa-solid fa-location-arrow text-[10px] text-brand-500"></i>
                                <span>約 ${item.distanceMeters} 公尺 · ${item.address}</span>
                            </p>
                        </div>

                        <!-- Price Tag & Actions -->
                        <div class="flex items-center justify-between pt-2 border-t border-gray-50">
                            <div>
                                <span class="text-[10px] text-gray-400 block">平均人均</span>
                                <span class="text-sm font-extrabold text-brand-600">
                                    $${item.minPrice} - $${item.maxPrice}
                                </span>
                            </div>

                            <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + item.address)}" 
                               target="_blank" 
                               class="bg-gray-100 text-gray-700 active:bg-brand-500 active:text-white px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1">
                                <i class="fa-solid fa-map-location-dot"></i>
                                <span>地圖導航</span>
                            </a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Random Picker Modal functions
        function openRandomModal() {
            if (filteredList.length === 0) {
                alert("目前搜尋條件下沒有可選擇的餐廳，請調整預算或距離！");
                return;
            }
            document.getElementById('randomModal').classList.remove('hidden');
            pickRandomRestaurant();
        }

        function pickRandomRestaurant() {
            if (filteredList.length === 0) return;
            const randomIndex = Math.floor(Math.random() * filteredList.length);
            currentRandomSelection = filteredList[randomIndex];

            const card = document.getElementById('randomResultCard');
            card.innerHTML = `
                <div class="flex items-center space-x-3">
                    <img src="${currentRandomSelection.image}" class="w-14 h-14 rounded-xl object-cover" onerror="this.src='https://placehold.co/200x200/f97316/ffffff?text=Food'">
                    <div>
                        <h4 class="font-bold text-gray-900 text-sm">${currentRandomSelection.name}</h4>
                        <p class="text-xs text-brand-600 font-extrabold mt-0.5">$${currentRandomSelection.minPrice} - $${currentRandomSelection.maxPrice}</p>
                        <p class="text-[10px] text-gray-400">${currentRandomSelection.category} · 評分 ${currentRandomSelection.rating}★</p>
                    </div>
                </div>
            `;
        }

        function confirmPick() {
            document.getElementById('randomModal').classList.add('hidden');
            if (currentRandomSelection) {
                window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(currentRandomSelection.name + ' ' + currentRandomSelection.address)}`, '_blank');
            }
        }
    </script>
</body>
</html>
